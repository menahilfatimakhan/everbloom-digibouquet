<svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bow-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- tails, behind the loops — shortened + tapered for a daintier look -->
  <g data-bow-part="tail-left" style="transform-origin: 97px 72px">
    <path d="M95,68 L83,104 C88,102 93,103 97,107 L101,70 Z" fill="var(--presentation-fill)" stroke="var(--color-line)" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g data-bow-part="tail-right" style="transform-origin: 103px 72px">
    <path d="M105,68 L117,104 C112,102 107,103 103,107 L99,70 Z" fill="var(--presentation-fill)" stroke="var(--color-line)" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <!-- loops — tightened and rounded (closer to the knot, more compact
       puffy shape) instead of the earlier wide wing-like sweep, for a
       smaller, cuter bow silhouette -->
  <g data-bow-part="loop-left" style="transform-origin: 100px 65px">
    <path d="M100,65 C94,48 72,40 56,46 C42,51 41,68 53,76 C68,85 92,78 100,65 Z" fill="var(--presentation-fill)" stroke="var(--color-line)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M100,65 C94,48 72,40 56,46 C42,51 41,68 53,76 C68,85 92,78 100,65 Z" fill="url(#bow-sheen)"/>
  </g>
  <g data-bow-part="loop-right" style="transform-origin: 100px 65px">
    <path d="M100,65 C106,48 128,40 144,46 C158,51 159,68 147,76 C132,85 108,78 100,65 Z" fill="var(--presentation-fill)" stroke="var(--color-line)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M100,65 C106,48 128,40 144,46 C158,51 159,68 147,76 C132,85 108,78 100,65 Z" fill="url(#bow-sheen)"/>
  </g>
  <!-- knot — kept relatively chunky against the now-smaller loops, which
       reads as cuter (proportionally bigger knot, like a hair-bow) -->
  <g data-bow-part="knot" style="transform-origin: 100px 66px">
    <path d="M87,54 C87,42 113,42 113,54 C118,61 118,71 113,78 C113,90 87,90 87,78 C82,71 82,61 87,54 Z"
          fill="var(--presentation-fill-deep)" stroke="var(--color-line)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M92,47 L92,85" stroke="var(--color-line)" stroke-width="1.25" opacity="0.35"/>
    <path d="M108,47 L108,85" stroke="var(--color-line)" stroke-width="1.25" opacity="0.35"/>
  </g>
</svg>
