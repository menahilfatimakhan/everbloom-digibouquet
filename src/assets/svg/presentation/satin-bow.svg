<svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bow-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- tails, behind the loops -->
  <g data-bow-part="tail-left" style="transform-origin: 96px 70px">
    <path d="M94,66 L74,122 C82,120 90,122 96,128 L102,70 Z" fill="var(--presentation-fill)" stroke="var(--color-line)" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g data-bow-part="tail-right" style="transform-origin: 104px 70px">
    <path d="M106,66 L126,122 C118,120 110,122 104,128 L98,70 Z" fill="var(--presentation-fill)" stroke="var(--color-line)" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <!-- loops -->
  <g data-bow-part="loop-left" style="transform-origin: 100px 65px">
    <path d="M100,65 C92,42 62,30 36,40 C16,48 14,74 32,84 C54,96 88,84 100,65 Z" fill="var(--presentation-fill)" stroke="var(--color-line)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M100,65 C92,42 62,30 36,40 C16,48 14,74 32,84 C54,96 88,84 100,65 Z" fill="url(#bow-sheen)"/>
  </g>
  <g data-bow-part="loop-right" style="transform-origin: 100px 65px">
    <path d="M100,65 C108,42 138,30 164,40 C184,48 186,74 168,84 C146,96 112,84 100,65 Z" fill="var(--presentation-fill)" stroke="var(--color-line)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M100,65 C108,42 138,30 164,40 C184,48 186,74 168,84 C146,96 112,84 100,65 Z" fill="url(#bow-sheen)"/>
  </g>
  <!-- knot -->
  <g data-bow-part="knot" style="transform-origin: 100px 66px">
    <path d="M84,52 C84,38 116,38 116,52 C122,60 122,72 116,80 C116,94 84,94 84,80 C78,72 78,60 84,52 Z"
          fill="var(--presentation-fill-deep)" stroke="var(--color-line)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M90,44 L90,88" stroke="var(--color-line)" stroke-width="1.25" opacity="0.35"/>
    <path d="M110,44 L110,88" stroke="var(--color-line)" stroke-width="1.25" opacity="0.35"/>
  </g>
</svg>
